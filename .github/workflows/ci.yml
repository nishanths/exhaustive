on:
  push:
    branches:
      - master
  workflow_dispatch:
name: ci
jobs:
  all:
    strategy:
      matrix:
        go-version: ["1.26", "1.x"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: "go.sum"
      - uses: actions/checkout@v7
      - run: go build ./...
      - run: go vet ./...
      - run: go build -o cmd/exhaustive/exhaustive-scripttest ./cmd/exhaustive
      - run: go test ./...
